name: Deploy BattleBot

on:
  push:
    branches:
      - main 
  workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        run: |
         ssh -o StrictHostKeyChecking=no \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'

            set -e
            cd /home/debian/BattleBot

            echo "▶ Pulling repo"
            git pull origin main

            echo "▶ Writing envs"
            DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
            DISCORD_GUILD_ID=${{ secrets.DISCORD_GUILD_ID }}

            SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}

            COMLINK_SECRET_KEY=${{ secrets.COMLINK_SECRET_KEY }}
            COMLINK_ACCESS_KEY=${{ secrets.COMLINK_ACCESS_KEY }}
            COMLINK_URL=${{ secrets.COMLINK_URL }}

            echo "▶ Stating data"
            cd Data            
            docker compose down
            docker compose up -d --build

            echo "▶ Stating Backend"
            cd ..\Backend\BattleBot            
            docker compose down
            docker compose up -d --build
          EOF
