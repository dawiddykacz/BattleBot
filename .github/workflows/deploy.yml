name: Deploy BattleBot

on:
  push:
    branches:
      - main 
  workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        run: |
         ssh -o StrictHostKeyChecking=no \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'

            set -e
            cd /home/debian/BattleBot

            echo "▶ Pulling repo"
            git pull origin main

            echo "▶ Stating data"
            cd Data            
            sudo docker compose down
            sudo docker compose up -d --build

            echo "▶ Stating Backend"
            cd ../Backend/BattleBot         
            sudo docker compose down
            sudo docker compose up -d --build

            echo "▶ Stating discord bot"
            cd ../../BattleBot-DiscordBot       
            sudo docker compose down
            sudo DISCORD_CLIENT_ID="${{ secrets.DISCORD_CLIENT_ID }}" \
              DISCORD_TOKEN="${{ secrets.DISCORD_TOKEN }}" \
              DISCORD_GUILD_ID="${{ secrets.DISCORD_GUILD_ID }}" \
              BACKEND_URL="${{ secrets.BACKEND_URL }}" \
              docker compose up -d --build 
